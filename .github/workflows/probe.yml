name: Sondagem dos sites

on:
  workflow_dispatch:
    inputs:
      modulo:
        description: "Script de sondagem (módulo Python)"
        default: scripts.probe_listings

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m ${{ inputs.modulo || 'scripts.probe_listings' }}
