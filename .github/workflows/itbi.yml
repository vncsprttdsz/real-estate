name: Transações (ITBI)

# Guias de ITBI pagas (Prefeitura de SP): publicação mensal, sem data fixa. Verifica duas vezes por mês;
# só baixa quando a página traz um link novo (o arquivo do ano corrente muda de nome a cada atualização).
on:
  schedule:
    - cron: "43 13 4,19 * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Baixar de novo os arquivos já em cache"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: itbi
  cancel-in-progress: false

jobs:
  itbi:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-itbi.txt
      - run: python -m imoveis.itbi ${{ inputs.force && '--force' || '' }}
      - name: Publica
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/itbi docs/transacoes.json
          git diff --cached --quiet && exit 0
          git commit -m "Atualiza transações (ITBI) $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4; do git pull --rebase && git push && break; sleep $((i*5)); done
