# Critérios de busca — edite aqui e faça commit; o próximo ciclo já usa os novos valores.
bairros:
  - Vila Nova Conceição
  - Itaim Bibi
  - Vila Uberabinha        # entre Itaim e VNC (CEPs 04514–04520); ZAP/Viva Real classificam à parte
cidade: São Paulo
estado: SP

area_minima_m2: 100

# Tipos aceitos (apartamento inclui cobertura, duplex, flat etc.)
tipos: [apartamento]

# Comprar e/ou alugar
negocios: [venda, aluguel]

# Orçamento (deixe null para sem limite). Vale para os AVISOS; o painel continua
# mostrando o mercado inteiro para as medianas não ficarem distorcidas.
# Aluguel: valor total mensal (aluguel + condomínio + IPTU quando disponível).
preco_max_venda: 2250000
preco_max_aluguel: 13000

# Sites monitorados (desligue algum colocando false)
fontes:
  zap: true
  vivareal: true
  quintoandar: true
  zuk: true

# Para onde vão os avisos (WhatsApp etc.). O painel continua mostrando tudo a partir de area_minima_m2.
avisos:
  area_minima_m2: 120          # só avisa imóveis com esta área ou mais
  quartos_minimos: 3           # e com pelo menos estes quartos (anúncio sem a informação é avisado)
  destacar_andar_alto_vista: true   # lê a descrição dos avisos imediatos e destaca (⭐) andar alto e vista livre
  imediato: [aluguel]          # avisa a cada coleta: anúncio novo, queda de preço e abaixo da mediana
  resumo_diario: [venda, leilao]   # uma mensagem por dia: quantos novos, bairros, quedas e oportunidades
  resumo_diario_hora: 23       # enviado na primeira coleta a partir desta hora (Brasília); se faltar, vai na seguinte
painel_url: https://vncsprttdsz.github.io/real-estate/

# Avisar também quando o preço de um anúncio já visto cair pelo menos X%
alerta_queda_preco_pct: 3

# Avisar quando um anúncio (novo, ou que baixou de preço) tiver R$/m² pelo menos X% abaixo da mediana dos
# anúncios do mesmo bairro, negócio e faixa de área (aluguel: valor total por m²). pct: null desliga.
# Com so_no_orcamento, compara só com os anúncios dentro do orçamento (no bairro inteiro, quase tudo que cabe
# no teto já fica abaixo da mediana). 25% ≈ 3 avisos por dia (medido em 29/10–07/11).
alerta_abaixo_mediana:
  pct: 25
  amostra_minima: 15      # anúncios no grupo de comparação; com menos, compara com o bairro inteiro
  so_no_orcamento: true   # false = compara com o bairro inteiro e avisa mesmo acima do teto de preço

# Histórico de transações (ITBI pago, Prefeitura de SP) — aba "Transações" do painel.
# Bairro de cada transação = bairro dos Correios do CEP (a coluna "Bairro" do ITBI é texto livre e falha em 60% dos casos).
transacoes:
  bairros:            # nome exibido: bairros dos Correios que entram nele
    Itaim Bibi: [Itaim Bibi, Chácara Itaim]
    Vila Nova Conceição: [Vila Nova Conceição]
    Jardim Paulista: [Jardim Paulista]
    Jardim Europa: [Jardim Europa]
    Jardim Paulistano: [Jardim Paulistano]
    Jardim América: [Jardim América]
    Vila Uberabinha: [Vila Uberabinha]
  prefixos_cep: ["014", "045"]   # pré-filtro (Jardins/Jd. Europa/Paulistano e Itaim/VNC); acelera a leitura
  janela_meses: 24               # meses guardados e exibidos (a partir do mês mais recente com dados)
  fator_area_util: 0.72          # área útil do anúncio ≈ 0,72 × área construída do ITBI (434 prédios casados, 12 meses)
  outliers_percentis: [1, 99]    # R$/m² fora desta faixa, por bairro, sai das métricas (fica marcado na tabela)
  n_minimo: 5                    # células com menos transações ficam ocultas
  lote_minimo: 5                 # N+ transações no mesmo prédio e data = compra em bloco (fora das métricas)
  predio_novo_anos: 2            # ACC até N anos antes da transação = prédio novo (preço pode ser da planta)
