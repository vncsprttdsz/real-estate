preco_max_aluguel: null

# Sites monitorados (desligue algum colocando false)
fontes:
  zap: true
  vivareal: true
  quintoandar: true
  zuk: true

# Avisar também quando o preço de um anúncio já visto cair pelo menos X%
alerta_queda_preco_pct: 3
